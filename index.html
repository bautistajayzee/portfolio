<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the page run edge to edge under the notch and
      the home indicator, which is what makes `env(safe-area-inset-*)` non-zero
      in the nav chrome. Without it those resolve to 0 and the page is inset by
      the OS instead — also fine, but then the chrome cannot choose its own
      padding and a notched phone gets a visibly cramped top bar.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Jayzee G. Bautista — IT, Design &amp; Problem-Solving</title>
    <meta
      name="description"
      content="Jayzee G. Bautista — an IT student and aspiring IT professional working across programming, graphic design, and problem-solving. Based in Cavite, Philippines."
    />
    <meta name="author" content="Jayzee G. Bautista" />

    <!--
      Both themes, not just the light one. A single hardcoded value left the
      browser's own chrome — the address bar on mobile, the title bar on some
      desktops — white against a dark page for anyone who chose dark.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Jayzee G. Bautista" />
    <meta
      property="og:description"
      content="IT, graphic design, and problem-solving. An aspiring IT professional based in Cavite, Philippines."
    />
    <!--
      `og:image` and `twitter:image`, both 1200x630, generated from
      `dist/__og.html` by screenshotting it with the real webfonts loaded - see
      the note at the top of that file. Rendered in a browser rather than by an
      SVG rasteriser because text metrics are the whole content of a share card
      and a rasteriser's guess at them is how you get a card with the name
      wrapped in the wrong place.

      Served from `/og-image.png`. The absolute URL is left to the platform:
      every consumer resolves a relative `og:image` against the page URL, and
      hardcoding a host here would break the preview deployments, which have
      their own.

      There was deliberately no `og:image` before, because pointing at a path
      that does not resolve produces a worse result in every preview than
      omitting it: a broken thumbnail. Now that the file exists, this is worth
      writing.
    -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jayzee G. Bautista — IT, design and problem-solving" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      The PNG icons, and why they exist alongside the SVG.

      `favicon.svg` covers the browser tab and nothing else. Safari's "Add to
      Home Screen" reads `apple-touch-icon` and ignores SVG entirely - with no
      such link it screenshots the page, so the icon on an iPhone home screen
      used to be a thumbnail of the hero photograph. The manifest covers Android
      and installed-web-app surfaces, and a manifest with no icons is worse than
      no manifest at all.

      All three PNGs are generated from `favicon.svg` by `scripts/make-icons.mjs`,
      so there is one source for the mark rather than four hand-edited copies.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Applied before first paint so a dark-theme visitor never sees a white
      flash. Kept inline and tiny on purpose — it has to run before the
      stylesheet and the app bundle do.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode or blocked storage — fall back to the light default */
        }
      })()
    </script>

    <!--
      Fonts are self-hosted: three `latin`-subset woff2 files in `public/fonts`,
      declared in `src/style.css`. See the note at the top of that file for why,
      and for the licence.

      They are preloaded, which was not possible while they came from a CDN.
      From Google the browser had to fetch the stylesheet first, read the woff2
      URLs out of it, and only then start the font download — a two-hop chain on
      the critical path. Same-origin `preload` starts all three in parallel with
      the CSS.

      Only the two that paint above the fold are preloaded. The mono is used for
      11px metadata, `font-display: swap` shows a fallback within a frame or
      two, and preloading a face nothing waits for would just compete for
      bandwidth with the ones that matter.

      To add a weight, a style, or a character outside `latin`, add a file and
      a face in style.css. Nothing here needs changing.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The portrait, preloaded.

      `fetchpriority="high"` on the <img> was not enough on its own. The tag is
      only reached after the stylesheet and the module bundle have downloaded,
      parsed, executed and mounted, so the browser was not starting a 99 KB
      request until well after it could have. A preload here puts it in flight
      immediately, in parallel with the CSS and the JS, which is where the
      largest element on the page should be fetched from.

      Two links rather than one, each with the same `media` as the matching
      `<source>` in ProfileImage. An earlier version used `imagesrcset` with
      `imagesizes` on a single link, which is a different mechanism: it picks by
      density, so at a desktop width it chose the 600px file while the
      `<picture>` chose the 850px one. The preloaded file was discarded and the
      second fetched anyway — two requests where one was intended, so the
      preload bought nothing. Mirroring the media queries makes the two agree.
    -->
    <link
      rel="preload"
      as="image"
      href="/photo-600.webp"
      media="(max-width: 640px)"
      fetchpriority="high"
      type="image/webp"
    />
    <link
      rel="preload"
      as="image"
      href="/photo.webp"
      media="(min-width: 641px)"
      fetchpriority="high"
      type="image/webp"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
