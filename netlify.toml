# Netlify build configuration.
#
# The site is deployed on Vercel; this file is kept so the Netlify path still
# works whenever that account has production deploys again, which at the time of
# writing it does not - the team is on operational credits, which keep the
# existing deploy online but cannot pay for a new one.
#
# What is here is the build config and the security headers, and the headers are
# the reason this file is longer than three lines. They are duplicated in
# `vercel.json`, because neither host reads the other's config, and a host with
# no header file is a site with no CSP at all. The two are kept in step by
# `scripts/audit-headers.mjs`.
#
# The presence function is NOT here. It used to be, at
# `netlify/functions/viewers.js`, backed by `@netlify/blobs`. It is now
# `api/viewers.js` on Vercel Functions, backed by Redis, because Blobs is a
# Netlify product that exists nowhere else. So on this host `/api/viewers` 404s,
# the client reads that as "nobody is here", and the viewing badge does not
# render. Nothing breaks; one optional flourish is absent. See README.md.

[build]
  command = "npm run build"
  publish = "dist"

# Pinned because Vite 8 declares `engines.node: ^20.19.0 || >=22.12.0`. Without
# this the build runs on whatever Node Netlify defaults to that month, and the
# failure looks like a broken project rather than a runtime mismatch. "22" means
# the newest 22.x, so it stays above 22.12 while still taking security patches.
# Vercel reads `engines.node` in package.json instead.
[build.environment]
  NODE_VERSION = "22"

# ===========================================================================
# Security headers
#
# Every header below is deliberate, and the CSP is the reason this file is
# longer than three lines.
#
# The script hash was computed from the *built* output, not written by hand:
#
#   1. npm run build
#   2. Read dist/index.html, take the single inline <script> body
#   3. sha256 its exact UTF-8 bytes, then BASE64 the digest
#      PowerShell:
#        $h=[System.IO.File]::ReadAllText('dist/index.html')
#        $b=[regex]::Match($h,'(?s)<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>').Groups[1].Value
#        [Convert]::ToBase64String([System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($b)))
#   4. paste it into script-src below, keeping the `sha256-` prefix
#
# An earlier version of this file carried a second hash here, for the inline
# script Netlify's deploy-status HUD injects. It has been removed because it
# cannot work: Best Practices still scored 92 with it in place, so that script's
# content varies between loads and a static hash can never match it. A hash that
# looks like a fix but never matches is worse than none, and it widens the policy
# for nothing.
#
# Best Practices reads 92 in a browser signed in to Netlify and 100 in every
# other one. The HUD is injected only for a recognised Netlify session: a plain
# request with a normal browser user agent and no cookies receives none of it.
# So that 92 is the site owner seeing the host's own debug tool, not a visitor.
# Confirmed against the deployed site from an unauthenticated browser: zero
# console errors, zero CSP violations.
#
# If you are signed in to Netlify and auditing, an incognito window will show
# 100 and is the reading that describes what other people get.
#
# **Base64, not hex.** A Content-Security-Policy hash is `sha256-<base64>`. Hex
# is accepted nowhere in the spec, and a hex value fails *silently and visibly at
# once*: every check that compares hex to hex still passes, so the value looks
# verified right up until the browser blocks the script in production. That is
# exactly what happened — the shipped policy carried a hex digest, the page threw
# a CSP error on every load, and the before-paint theme script never ran.
#
# **If you edit the inline theme script in index.html, recompute this.** A stale
# hash does not break the site — it stops that one script, which is the
# before-paint theme, so you get a light flash on a dark-theme load and a CSP
# error in the console. Recoverable, but worth knowing.
#
# `style-src` needs 'unsafe-inline' and always will: Vue writes element styles
# directly (the tilt, the caret, the scroll lock), and there is no nonce-based
# way to cover that without a build plugin. Script injection is still blocked,
# which is the protection that matters.
#
# Note what is NOT in this policy any more: `fonts.googleapis.com` and
# `fonts.gstatic.com`. The fonts are self-hosted, so the page makes no
# third-party connection at all and `font-src` is just `'self'`.
# ===========================================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      form-action 'self'; \
      script-src 'self' 'sha256-LvydToO4WN0gpn8ckKdBSEAFWHDnLzZzzIaBByvvF84='; \
      style-src 'self' 'unsafe-inline'; \
      font-src 'self'; \
      img-src 'self' data:; \
      connect-src 'self'; \
      manifest-src 'self'; \
      upgrade-insecure-requests"""

    # Refuse to have the browser guess a content type. Without this a file
    # served as text/plain can be sniffed as something executable.
    X-Content-Type-Options = "nosniff"

    # Sends the full URL to your own origin, the origin only cross-origin, and
    # nothing on downgrade. A portfolio is linked to from places, and this stops
    # the referring path leaking to anywhere it is linked from.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Clickjacking. `frame-ancestors` in the CSP above is the modern form and
    # supersedes this, but the header is kept for older browsers.
    X-Frame-Options = "DENY"

    # This site has no camera, microphone, geolocation or interest-cohort
    # surface. Saying so means a future bug cannot quietly add one.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # HTTPS-only, two years, subdomains included. Not preloaded: preloading is a
    # one-way door that needs domain registration, and that is your call.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# The presence endpoint is live state and must never be cached, by Netlify or by
# any browser. `api/viewers.js` already sends this header itself, but pinning it
# here too means a misconfigured build cannot serve a stale count.
[[headers]]
  for = "/api/viewers"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Hashed build assets never change under the same name, so they are safe to
# cache hard. `index.html` must not be, or a deploy would never reach anyone.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===========================================================================
# PDF framing
#
# The resume opens in the lightbox over an iframe, and the `/*` block above
# refuses framing on every response — so the deployed resume rendered as an
# empty box. `vite preview` sends no security headers at all, which is why this
# only ever appeared once deployed: the file was always a healthy 200
# `application/pdf`, just framed by a response that forbade being framed.
#
# Relaxed for PDFs only, and only back to same-origin: `frame-ancestors 'self'`
# alongside `X-Frame-Options: SAMEORIGIN`, which is the standard pairing for
# "my own site may put this in an iframe". A third-party site still cannot, and
# there is nothing worth clickjacking in a static document — the protection that
# matters is on the interactive pages, and it is untouched.
#
# Matched on the extension rather than the literal path on purpose. The file is
# named `Bautista, Jayzee G. (RESUME).pdf`, and that name carries a space, a
# comma and a pair of parentheses — a `for` pattern naming it directly would
# have to match the percent-encoded request path and would rot on any rename.
# `*.pdf` is unaffected by all of that.
#
# The policy here is deliberately short rather than a copy of the global one: a
# PDF has no scripts, no styles and no subresources to protect, so there is
# nothing to allow, and the only thing that actually governs it is who may frame
# it.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'none'; object-src 'none'"
